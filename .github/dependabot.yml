version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps): "
    labels: [dependencies]
    assignees: [jarmos-san]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps): "
    labels: [dependencies]
    assignees: [jarmos-san]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps): "
    labels: [dependencies]
    assignees: [jarmos-san]
    open-pull-requests-limit: 3
