version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps): "
    labels: [dependencies]
    assignees: [jarmos-san]
    open-pull-requests-limit: 3
    groups:
      gh-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps): "
    labels: [dependencies]
    assignees: [jarmos-san]
    open-pull-requests-limit: 3
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: "development"
